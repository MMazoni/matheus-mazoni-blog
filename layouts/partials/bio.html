<div class="bio">
  <a href="{{ "/sobre-mim/" | relURL }}" class="bio-avatar">
    <img
      src="{{ "images/profile-pic.png" | relURL }}"
      alt="Foto de perfil"
      width="100"
      height="100"
      loading="eager"
    >
  </a>
  {{ with site.Params.author }}
  <p>
    Escrito por <strong>{{ .name }}</strong>, {{ .summary }}
  </p>
  {{ end }}
</div>
